services:
  - type: web
    name: catws-cloud
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_NAME
        value: Catws Music API
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://YOUR-RENDER-SERVICE.onrender.com
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SYNC_PASSWORD
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_AUDIO_MB
        value: "50"
      - key: MAX_IMAGE_MB
        value: "8"
      - key: CORS_ORIGINS
        value: "*"
