name: eightd_music
publish_to: 'none'
description: Catws Songs cloud-ready music app with personal 8D creator, downloads, personal 8D library, admin tools, playlists and streaming.
version: 4.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  just_audio: ^0.9.40
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
